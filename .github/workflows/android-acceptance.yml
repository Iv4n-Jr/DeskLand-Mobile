
name: DeskLand - Testes de Aceitacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-tests:
    name: Testes no Emulador
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permitir executar Gradle
        run: chmod +x mobile/gradlew

      - name: Habilitar aceleracao KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      
      - name: Executar testes Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./mobile/gradlew -p mobile connectedDebugAndroidTest


      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-aceitacao
          path: |
            mobile/app/build/reports/androidTests/
            mobile/app/build/outputs/androidTest-results/
          if-no-files-found: warn
