
name: DeskLand Mobile - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build e Testes Android

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      # Baixar os arquivos do GitHub
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # Configurar ambiente Java
      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Preparar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Permissão de execução
      - name: Permitir execução do Gradle
        run: chmod +x gradlew

      # Testes unitários
      - name: Executar testes
        run: ./gradlew testDebugUnitTest

      # Compilar aplicativo
      - name: Gerar APK
        run: ./gradlew assembleDebug

      # Salvar aplicativo compilado
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskLand-Mobile-APK
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error