
name: DeskLand - Docker CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build e Publicacao Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem para teste
        run: |
          docker build \
            -f docker/Dockerfile \
            -t deskland-api:ci .

      - name: Verificar sintaxe no container
        run: |
          docker run --rm \
            --entrypoint node \
            deskland-api:ci \
            --check app.js

      - name: Verificar rotas no container
        run: |
          docker run --rm \
            --entrypoint sh \
            deskland-api:ci \
            -c 'test -r routes/usuarioRoutes.js && test -r routes/contatoRoutes.js && test -r routes/uploadRoutes.js'

      - name: Definir nome da imagem
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deskland-api" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem Docker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
