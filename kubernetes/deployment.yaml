
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deskland-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: deskland-api

  template:
    metadata:
      labels:
        app: deskland-api

    spec:
      containers:
        - name: api
          image: deskland-api:k8s-v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: deskland-api-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
